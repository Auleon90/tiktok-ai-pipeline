<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="id">
<title>Science × Islam — TikTok Motion 60s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600&family=EB+Garamond:ital,wght@0,400;1,400;1,500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1080px; height: 1920px;
  overflow: hidden; background: #000;
}

/* ── LAYER 0: Background ── */
#bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 20%, #060820 0%, #030412 55%, #000 100%);
  z-index: 0;
}

/* ── LAYER 1: Science canvas ── */
#science-canvas {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 1;
}

/* ── LAYER 2: Islamic light rays ── */
#rays {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 2; opacity: 0;
}
.ray {
  position: absolute; top: -100px; left: 50%;
  transform-origin: top center; opacity: 0;
}
.ray-1 { width: 3px; height: 2200px;
  background: linear-gradient(to bottom, rgba(200,169,90,0.55), transparent);
  transform: rotate(-28deg); }
.ray-2 { width: 2px; height: 2000px;
  background: linear-gradient(to bottom, rgba(200,169,90,0.4), transparent);
  transform: rotate(-12deg); }
.ray-3 { width: 2px; height: 2000px;
  background: linear-gradient(to bottom, rgba(200,169,90,0.4), transparent);
  transform: rotate(12deg); }
.ray-4 { width: 3px; height: 2200px;
  background: linear-gradient(to bottom, rgba(200,169,90,0.55), transparent);
  transform: rotate(28deg); }

/* ── LAYER 3: Vignette ── */
#vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 22%, rgba(0,0,0,0.88) 100%);
  pointer-events: none; z-index: 3;
}

/* ── LAYER 4: Scenes ── */
.scene {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 100px 80px; opacity: 0;
  pointer-events: none; z-index: 20;
}

/* ══════════════════════════════════
   SCENE 1 — HOOK
══════════════════════════════════ */
#scene-hook { justify-content: center; }

.hook-eyebrow {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 28px; letter-spacing: 8px;
  color: #60a0ff; text-transform: uppercase;
  margin-bottom: 56px; opacity: 0;
  text-align: center;
}

.hook-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 80px; font-weight: 900;
  color: #fff; text-align: center;
  line-height: 1.25; opacity: 0;
  text-shadow: 0 0 80px rgba(96,160,255,0.35);
}

.hook-text em {
  color: #60a0ff; font-style: normal;
  text-shadow: 0 0 40px rgba(96,160,255,0.8);
}

.hook-divider {
  width: 120px; height: 2px;
  background: linear-gradient(to right, transparent, #60a0ff, transparent);
  margin: 50px auto 0; opacity: 0;
}

/* ══════════════════════════════════
   SCENE 2 — SCIENCE FACTS
══════════════════════════════════ */
#scene-science { justify-content: space-between; padding-top: 180px; padding-bottom: 180px; }

.science-header {
  width: 100%; text-align: center; opacity: 0;
}

.science-eyebrow {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 24px; letter-spacing: 7px;
  color: #60a0ff; text-transform: uppercase;
  margin-bottom: 24px;
}

.science-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 76px; font-weight: 900;
  color: #fff; line-height: 1.2;
  text-shadow: 0 0 60px rgba(96,160,255,0.3);
}

.facts-container {
  width: 100%; display: flex;
  flex-direction: column; gap: 36px;
}

.fact-item {
  display: flex; align-items: flex-start;
  gap: 28px; opacity: 0;
  transform: translateX(-80px);
}

.fact-dot {
  width: 18px; height: 18px; border-radius: 50%;
  background: #60a0ff; flex-shrink: 0;
  margin-top: 12px;
  box-shadow: 0 0 24px rgba(96,160,255,0.9),
              0 0 48px rgba(96,160,255,0.4);
}

.fact-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 58px; font-weight: 900;
  color: #e8f4ff; line-height: 1.25;
}

.fact-text strong { color: #60a0ff; font-weight: 900; }

/* ══════════════════════════════════
   SCENE 3 — ISLAMIC
══════════════════════════════════ */
#scene-islamic { justify-content: center; }

.islamic-ornament {
  display: flex; align-items: center;
  gap: 0; margin-bottom: 68px; opacity: 0;
}

.orn-line {
  width: 180px; height: 2px;
  background: linear-gradient(to right, transparent, #c8a95a, transparent);
}
.orn-line.right {
  background: linear-gradient(to left, transparent, #c8a95a, transparent);
}

.orn-diamond {
  width: 14px; height: 14px;
  background: #c8a95a; transform: rotate(45deg);
  margin: 0 24px; flex-shrink: 0;
  box-shadow: 0 0 16px rgba(200,169,90,0.8);
}

.arabic-text {
  font-family: 'Amiri', 'Arial Unicode MS', serif;
  font-size: 76px; color: #f5e6b8;
  text-align: center; line-height: 1.9;
  direction: rtl; unicode-bidi: bidi-override;
  text-shadow: 0 0 50px rgba(200,169,90,0.5),
               0 2px 8px rgba(0,0,0,0.8);
  opacity: 0; margin-bottom: 52px;
  width: 100%;
}

.arabic-translation {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 48px; font-style: italic;
  color: #ecdfa8; text-align: center;
  line-height: 1.65; opacity: 0;
  margin-bottom: 36px;
}

.arabic-source {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 26px; letter-spacing: 4px;
  color: #c8a95a; text-align: center;
  opacity: 0;
}

/* ══════════════════════════════════
   SCENE 4 — REFLECTION
══════════════════════════════════ */
#scene-reflection { justify-content: center; }

.reflection-quote {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 56px; font-style: italic;
  color: #e8e8e8; text-align: center;
  line-height: 1.65; opacity: 0;
  text-shadow: 0 0 40px rgba(200,169,90,0.2);
}

.reflection-quote strong {
  color: #c8a95a; font-weight: 500;
  font-style: normal;
}

/* ══════════════════════════════════
   SCENE 5 — CTA
══════════════════════════════════ */
#scene-cta { justify-content: center; }

.cta-ring {
  position: absolute; border-radius: 50%;
  border: 2px solid rgba(200,169,90,0.25);
  opacity: 0; pointer-events: none;
}

.cta-eyebrow {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 26px; letter-spacing: 8px;
  color: #c8a95a; text-transform: uppercase;
  margin-bottom: 54px; opacity: 0; text-align: center;
}

.cta-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 70px; font-weight: 900;
  color: #fff; text-align: center;
  line-height: 1.3; opacity: 0;
  text-shadow: 0 0 60px rgba(200,169,90,0.5);
  position: relative; z-index: 2;
}

.cta-hashtags {
  margin-top: 64px; opacity: 0;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 26px; letter-spacing: 2px;
  color: rgba(200,169,90,0.65);
  text-align: center; line-height: 2;
  position: relative; z-index: 2;
}
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="science-canvas"></canvas>

<div id="rays">
  <div class="ray ray-1"></div>
  <div class="ray ray-2"></div>
  <div class="ray ray-3"></div>
  <div class="ray ray-4"></div>
</div>

<div id="vignette"></div>

<!-- ── SCENE 1: HOOK ── -->
<div id="scene-hook" class="scene">
  <div class="hook-eyebrow" id="hook-eyebrow">FAKTA ILMIAH</div>
  <div class="hook-text"    id="hook-text">Loading…</div>
  <div class="hook-divider" id="hook-divider"></div>
</div>

<!-- ── SCENE 2: SCIENCE ── -->
<div id="scene-science" class="scene">
  <div class="science-header" id="science-header">
    <div class="science-eyebrow" id="science-eyebrow">ILMU PENGETAHUAN</div>
    <div class="science-title"   id="science-title">Loading…</div>
  </div>
  <div class="facts-container" id="facts-container">
    <div class="fact-item" id="fact-0"><div class="fact-dot"></div><div class="fact-text" id="fact-text-0"></div></div>
    <div class="fact-item" id="fact-1"><div class="fact-dot"></div><div class="fact-text" id="fact-text-1"></div></div>
    <div class="fact-item" id="fact-2"><div class="fact-dot"></div><div class="fact-text" id="fact-text-2"></div></div>
  </div>
</div>

<!-- ── SCENE 3: ISLAMIC ── -->
<div id="scene-islamic" class="scene">
  <div class="islamic-ornament" id="islamic-ornament">
    <span class="orn-line"></span>
    <span class="orn-diamond"></span>
    <span class="orn-line right"></span>
  </div>
  <div class="arabic-text"        id="arabic-text"></div>
  <div class="arabic-translation" id="arabic-translation"></div>
  <div class="arabic-source"      id="arabic-source"></div>
</div>

<!-- ── SCENE 4: REFLECTION ── -->
<div id="scene-reflection" class="scene">
  <div class="reflection-quote" id="reflection-quote"></div>
</div>

<!-- ── SCENE 5: CTA ── -->
<div id="scene-cta" class="scene">
  <div class="cta-ring" id="ring-1" style="width:640px;height:640px;top:calc(50% - 320px);left:calc(50% - 320px)"></div>
  <div class="cta-ring" id="ring-2" style="width:860px;height:860px;top:calc(50% - 430px);left:calc(50% - 430px)"></div>
  <div class="cta-ring" id="ring-3" style="width:1080px;height:1080px;top:calc(50% - 540px);left:calc(50% - 540px)"></div>
  <div class="cta-eyebrow" id="cta-eyebrow">RENUNGKAN</div>
  <div class="cta-text"    id="cta-text"></div>
  <div class="cta-hashtags" id="cta-hashtags"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
        integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
        crossorigin="anonymous"></script>
<script>
// ═══════════════════════════════════════════════════════════
// INJECT_STORYBOARD_HERE
// ═══════════════════════════════════════════════════════════

// Default storyboard (diganti oleh inject_storyboard.py)
const DEFAULT_SB = {
  hook: "Tahukah kamu? Setiap detik, otakmu memproses lebih banyak informasi dari seluruh <em>internet</em> di dunia",
  hook_label: "FAKTA ILMIAH",
  science_title: "Otak Manusia",
  science_facts: [
    "<strong>86 miliar</strong> neuron aktif",
    "<strong>100 triliun</strong> sinapsis terhubung",
    "Memproses <strong>400 M bit</strong> per detik"
  ],
  islamic: {
    arabic: "وَفِي أَنفُسِكُمْ ۚ أَفَلَا تُبْصِرُونَ",
    translation: "Dan pada dirimu sendiri,\napakah kamu tidak memperhatikan?",
    source: "QS. Adz-Dzariyat: 21"
  },
  reflection: "Allah menciptakan otak dengan kompleksitas yang tak tertandingi teknologi manusia — namun kita sering menggunakannya untuk hal yang <strong>melalaikan</strong> kita dari-Nya",
  cta: "Sudahkah kamu bersyukur atas nikmat akal yang Allah berikan hari ini?",
  hashtags: "#MotivasiIslam #SainsDanIslam #FaktaIlmiah #BersyukurSelalu #FYP",
  visual_cue: "neuron",
  total_duration: 64
};

const SB = (typeof window !== 'undefined' && window.STORYBOARD) ? window.STORYBOARD : DEFAULT_SB;

// ── Populate DOM ──
document.getElementById('hook-eyebrow').textContent = SB.hook_label || 'FAKTA ILMIAH';
document.getElementById('hook-text').innerHTML       = SB.hook || '';
document.getElementById('science-title').textContent = SB.science_title || '';

(SB.science_facts || []).forEach((f, i) => {
  const el = document.getElementById('fact-text-' + i);
  if (el) el.innerHTML = f;
});

if (SB.islamic) {
  document.getElementById('arabic-text').textContent        = SB.islamic.arabic || '';
  document.getElementById('arabic-translation').innerHTML   = (SB.islamic.translation || '').replace(/\n/g, '<br>');
  document.getElementById('arabic-source').textContent      = SB.islamic.source || '';
}

document.getElementById('reflection-quote').innerHTML = SB.reflection || '';
document.getElementById('cta-text').innerHTML          = SB.cta || '';
document.getElementById('cta-hashtags').innerHTML      = (SB.hashtags || '')
  .split(' ').join('<br>');

// ══════════════════════════════════════════════════════
// CANVAS: Particle / Science visualization
// ══════════════════════════════════════════════════════
const canvas = document.getElementById('science-canvas');
const ctx    = canvas.getContext('2d');
canvas.width  = 1080;
canvas.height = 1920;

let currentScene = 'hook';
let canvasAlpha  = 0;

class Particle {
  constructor() { this.reset(true); }
  reset(rand) {
    this.x  = rand ? Math.random() * 1080 : Math.random() * 1080;
    this.y  = rand ? Math.random() * 1920 : -20;
    this.vx = (Math.random() - 0.5) * 0.9;
    this.vy = (Math.random() - 0.5) * 0.9;
    this.r  = Math.random() * 2.8 + 0.8;
    this.alpha = Math.random() * 0.55 + 0.1;
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.02 + Math.random() * 0.03;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.pulse += this.pulseSpeed;
    if (this.x < -20 || this.x > 1100) this.vx *= -1;
    if (this.y < -20 || this.y > 1940) this.vy *= -1;
  }
}

const NUM_PARTICLES = 130;
const particles = Array.from({length: NUM_PARTICLES}, () => new Particle());

function drawCanvas() {
  ctx.clearRect(0, 0, 1080, 1920);
  if (canvasAlpha <= 0.01) return;

  const isIslamic = currentScene === 'islamic';
  const isCTA     = currentScene === 'cta';
  const baseColor = (isIslamic || isCTA) ? '200,169,90' : '96,160,255';
  const connDist  = currentScene === 'science' ? 240 : 200;

  particles.forEach(p => p.update());

  // Connection lines
  for (let i = 0; i < NUM_PARTICLES; i++) {
    for (let j = i + 1; j < NUM_PARTICLES; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < connDist) {
        const a = (1 - d / connDist) * 0.22 * canvasAlpha;
        ctx.strokeStyle = `rgba(${baseColor},${a})`;
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }

  // Particles
  particles.forEach(p => {
    const pulseMod = 0.85 + Math.sin(p.pulse) * 0.15;
    const a = p.alpha * canvasAlpha * pulseMod;
    const r = p.r;

    // Glow halo
    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 5);
    grd.addColorStop(0, `rgba(${baseColor},${a * 0.25})`);
    grd.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 5, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Core dot
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${baseColor},${a})`;
    ctx.fill();
  });
}

(function animLoop() { drawCanvas(); requestAnimationFrame(animLoop); })();

// ══════════════════════════════════════════════════════
// GSAP MASTER TIMELINE
// Total: SB.total_duration seconds (default 64s)
// Scene map:
//   0  – 6  : Hook
//   6  – 24 : Science facts (3 facts)
//   24 – 40 : Islamic verse
//   40 – 54 : Reflection
//   54 – 64 : CTA
// ══════════════════════════════════════════════════════
const TOTAL = SB.total_duration || 64;

const tl = gsap.timeline();

// Canvas fade-in
tl.to({v:0}, {
  v: 1, duration: 1,
  onUpdate() { canvasAlpha = this._targets[0].v; }
}, 0);

// ── 1. HOOK (0–6s) ──────────────────────────────────
tl.set('#scene-hook', {opacity: 0}, 0);
tl.to('#scene-hook', {opacity: 1, duration: 0.3}, 0.1);
tl.set('#hook-eyebrow', {y: -20, opacity: 0});
tl.to('#hook-eyebrow', {y: 0, opacity: 1, duration: 0.6, ease: 'power2.out'}, 0.4);
tl.set('#hook-text', {y: 60, opacity: 0});
tl.to('#hook-text', {y: 0, opacity: 1, duration: 0.9, ease: 'power3.out'}, 1.0);
tl.to('#hook-divider', {opacity: 1, duration: 0.5}, 2.2);
tl.to('#scene-hook', {opacity: 0, duration: 0.5}, 5.5);

// ── 2. SCIENCE FACTS (6–24s) ────────────────────────
tl.set({}, {onComplete: () => currentScene = 'science'}, 6);
tl.to('#scene-science', {opacity: 1, duration: 0.4}, 6.1);
tl.set('#science-header', {y: -30, opacity: 0});
tl.to('#science-header', {y: 0, opacity: 1, duration: 0.7, ease: 'power2.out'}, 6.4);
tl.to('#facts-container', {opacity: 1, duration: 0.3}, 7.0);

// Fact 1
tl.set('#fact-0', {x: -80, opacity: 0});
tl.to('#fact-0', {x: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.4)'}, 7.6);
// Fact 2
tl.set('#fact-1', {x: -80, opacity: 0});
tl.to('#fact-1', {x: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.4)'}, 12.5);
// Fact 3
tl.set('#fact-2', {x: -80, opacity: 0});
tl.to('#fact-2', {x: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.4)'}, 18.0);

tl.to('#scene-science', {opacity: 0, duration: 0.5}, 23.5);

// ── 3. ISLAMIC VERSE (24–40s) ───────────────────────
tl.set({}, {onComplete: () => currentScene = 'islamic'}, 24);
tl.to('#scene-islamic', {opacity: 1, duration: 0.3}, 24.1);
// Rays
tl.to('#rays',   {opacity: 1, duration: 2.5, ease: 'power1.in'}, 24.2);
tl.to('.ray-1, .ray-4', {opacity: 1, duration: 2},   24.2);
tl.to('.ray-2, .ray-3', {opacity: 1, duration: 2},   24.6);
// Ornament
tl.set('#islamic-ornament', {scaleX: 0.5, opacity: 0});
tl.to('#islamic-ornament', {scaleX: 1, opacity: 1, duration: 0.7, ease: 'power2.out'}, 24.5);
// Arabic text
tl.set('#arabic-text', {scaleX: 1.08, opacity: 0});
tl.to('#arabic-text', {scaleX: 1, opacity: 1, duration: 1.4, ease: 'power2.out'}, 25.5);
// Translation
tl.set('#arabic-translation', {y: 30, opacity: 0});
tl.to('#arabic-translation', {y: 0, opacity: 1, duration: 0.9, ease: 'power2.out'}, 28.0);
// Source
tl.to('#arabic-source', {opacity: 1, duration: 0.6}, 30.2);

tl.to('#scene-islamic', {opacity: 0, duration: 0.5}, 39.5);
tl.to('#rays',          {opacity: 0, duration: 0.5}, 39.5);

// ── 4. REFLECTION (40–54s) ──────────────────────────
tl.set({}, {onComplete: () => currentScene = 'reflection'}, 40);
tl.to('#scene-reflection', {opacity: 1, duration: 0.4}, 40.1);
tl.set('#reflection-quote', {y: 40, opacity: 0});
tl.to('#reflection-quote', {y: 0, opacity: 1, duration: 1.3, ease: 'power2.out'}, 40.6);
tl.to('#scene-reflection', {opacity: 0, duration: 0.5}, 53.5);

// ── 5. CTA (54–64s) ─────────────────────────────────
tl.set({}, {onComplete: () => currentScene = 'cta'}, 54);
tl.to('#scene-cta', {opacity: 1, duration: 0.3}, 54.1);

// Pulsing rings (looping)
gsap.to('#ring-1', {
  opacity: 0.65, scale: 1.06, duration: 1.1,
  ease: 'sine.inOut', yoyo: true, repeat: -1
});
gsap.to('#ring-2', {
  opacity: 0.4, scale: 1.04, duration: 1.4,
  ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 0.3
});
gsap.to('#ring-3', {
  opacity: 0.2, scale: 1.02, duration: 1.8,
  ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 0.6
});

tl.to('#cta-eyebrow', {opacity: 1, duration: 0.5}, 54.6);
tl.set('#cta-text', {y: 40, opacity: 0});
tl.to('#cta-text', {y: 0, opacity: 1, duration: 0.9, ease: 'power2.out'}, 55.4);
tl.to('#cta-hashtags', {opacity: 1, duration: 0.7}, 58.0);

// Hold to end
tl.to({}, {duration: 0.5}, TOTAL);

console.log('[ScienceMotion] Timeline ready |', TOTAL + 's | topic:', SB.science_title);
</script>
</body>
</html>
